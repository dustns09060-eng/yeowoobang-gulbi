<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<title>모네 굴비엮기</title>
<style>
:root{--bg:#fff7fa;--card:#fff;--text:#262329;--muted:#77717b;--line:#ece6eb;--pink:#ff5d93;--ok:#16865b;--bad:#d54848;--soft:#f6f0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:780px;margin:auto;padding:14px}
header{position:sticky;top:0;z-index:10;background:rgba(255,247,250,.95);backdrop-filter:blur(8px);padding:8px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:900;font-size:20px} .sub{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 4px 18px rgba(0,0,0,.035)}
h2{font-size:17px;margin:0 0 9px} input,select,textarea{width:100%;padding:12px;border:1px solid #ddd3db;border-radius:12px;font-size:16px;background:#fff}
textarea{min-height:74px;resize:vertical} .row{display:flex;gap:8px;flex-wrap:wrap} .row>*{flex:1;min-width:120px}
button,a.btn{border:0;border-radius:12px;padding:12px 13px;font-weight:800;font-size:14px;cursor:pointer;text-decoration:none;text-align:center}
button.primary{background:var(--pink);color:#fff} button.secondary,a.btn{background:var(--soft);color:#393138} button.ok{background:#e8f7ef;color:#0b704a}
button.done{background:#dff5e9;color:#086841} button.bad{background:#fff0f0;color:#a63232} button:disabled{opacity:.55;cursor:not-allowed}
.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#f2edf1;font-size:12px;margin-right:5px;margin-top:4px}
.msg{padding:10px 11px;border-radius:11px;background:#f4f0f3;font-size:14px;margin-top:9px} .msg.ok{background:#eaf8f1;color:#116b47} .msg.err{background:#fff0f0;color:#a42d2d}
.hidden{display:none!important} .progress{height:9px;background:#eee8ed;border-radius:99px;overflow:hidden;margin-top:8px} .progress>div{height:100%;background:var(--pink);width:0}
.item{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)} .item:first-child{border-top:0}
.no{font-size:18px;font-weight:900} .nick{font-weight:800} .iid{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px} .actions>*{flex:1;min-width:100px}
.topRoom{font-weight:800} .muted{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:7px;margin-top:8px} .tabs button{flex:1} .activeTab{background:var(--pink)!important;color:#fff!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:white;border-radius:20px;padding:17px}
.version{font-size:10px;color:#aaa;text-align:center;margin:16px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="brand">모네 굴비엮기 · 좋아요</div><div class="sub">Supabase V152.3 · 고정주소</div></div>
  <button class="secondary" onclick="openAdmin()">운영진</button>
</header>

<div class="card">
  <h2>오늘 굴비방</h2>
  <div id="roomBox" class="msg">현재 굴비방 확인 중…</div>
  <div id="roomPills"></div>
</div>

<div class="tabs">
  <button id="tabJoin" class="secondary activeTab" onclick="showSection('join')">참여/내정보</button>
  <button id="tabWork" class="secondary" onclick="showSection('work')">품앗이</button>
</div>

<section id="joinSection">
  <div class="card">
    <h2>내 참여정보 불러오기</h2>
    <div class="row">
      <input id="restoreNick" placeholder="닉네임">
      <input id="restoreId" placeholder="인스타 아이디">
    </div>
    <button class="secondary" style="width:100%;margin-top:8px" onclick="recoverMe()">내 참여정보 확인</button>
    <div id="restoreMsg"></div>
  </div>

  <div id="registerCard" class="card">
    <h2>새 참여 등록</h2>
    <input id="regNick" placeholder="닉네임">
    <div style="height:7px"></div>
    <input id="regId" placeholder="인스타 아이디 (@ 유무 상관없음)">
    <div style="height:7px"></div>
    <select id="regType" onchange="renderRegType()">
      <option value="GENERAL">참여</option>
      <option value="PASS">프패</option>
      <option value="PENALTY">벌칙</option>
    </select>
    <div id="urlWrap" style="margin-top:7px"><input id="regUrl" placeholder="인스타 게시물/릴스 링크"></div>
    <button id="regBtn" class="primary" style="width:100%;margin-top:9px" onclick="registerMe()">참여 등록</button>
    <div id="regMsg"></div>
  </div>

  <div id="myCard" class="card hidden">
    <h2>내 참여정보</h2>
    <div id="myInfo" class="msg ok"></div>
    <div id="myLinkWrap" style="margin-top:9px">
      <input id="myLinkInput" placeholder="내 인스타 링크">
      <button class="secondary" style="width:100%;margin-top:7px" onclick="updateMyLink()">내 링크 수정</button>
    </div>
    <div id="myLinkMsg"></div>
  </div>
</section>

<section id="workSection" class="hidden">
  <div class="card">
    <h2>내 진행현황</h2>
    <div id="progressText" class="muted">내 참여정보를 먼저 불러와주세요.</div>
    <div class="progress"><div id="progressBar"></div></div>
    <div class="row" style="margin-top:9px">
      <button class="secondary" onclick="loadMyDone()">완료기록 다시 불러오기</button>
      <button class="secondary" onclick="loadRoom()">목록 새로고침</button>
    </div>
  </div>
  <div class="card">
    <h2>굴비 목록</h2>
    <div class="muted">✔ 체크 · 다음 링크 열기 = 서버 저장 성공 확인 후 다음 링크가 열립니다.</div>
    <div id="list"></div>
  </div>
</section>

<div class="version">MONE V152.3 CUTOVER</div>
</div>

<div id="adminOverlay" class="overlay hidden" onclick="if(event.target===this)closeAdmin()">
  <div class="modal">
    <h2>운영진</h2>
    <input id="adminPin" type="password" placeholder="운영진 PIN">
    <div class="row" style="margin-top:8px">
      <button class="primary" onclick="adminLogin()">로그인</button>
      <button class="secondary" onclick="closeAdmin()">닫기</button>
    </div>
    <div id="adminMsg"></div>

    <div id="adminPanel" class="hidden">
      <hr style="border:0;border-top:1px solid #eee;margin:16px 0">
      <h2>새 굴비방 만들기</h2>
      <input id="newTitle" placeholder="예: 9/13(일)">
      <div style="height:7px"></div>
      <input id="newMax" type="number" min="1" value="300" placeholder="최대인원">
      <div style="height:7px"></div>
      <textarea id="newNote" placeholder="공지사항 (선택)"></textarea>
      <div style="height:7px"></div>
      <label class="muted">참여 마감일시 (선택)</label>
      <input id="newPartDeadline" type="datetime-local">
      <div style="height:7px"></div>
      <label class="muted">완료 마감일시 (선택)</label>
      <input id="newDoneDeadline" type="datetime-local">
      <button class="primary" style="width:100%;margin-top:9px" onclick="adminCreateRoom()">새 방 만들고 고정주소에 연결</button>
      <div id="createMsg"></div>

      <hr style="border:0;border-top:1px solid #eee;margin:16px 0">
      <h2>현재방 관리</h2>
      <div id="adminSummary" class="msg"></div>
      <button class="bad" style="width:100%;margin-top:8px" onclick="adminCloseCurrent()">현재방 마감</button>
    </div>
  </div>
</div>

<script>
const SB_URL="https://cnaowuduuolmcokzvpix.supabase.co";
const SB_KEY="sb_publishable_jzknuyag2yy-1S2sIW33cw_BgSoeLXB";
const STORE={
  nick:'MONE_V152_NICK', iid:'MONE_V152_IID', token:'MONE_V152_TOKEN',
  room:'MONE_V152_ROOM', pin:'MONE_V152_ADMIN_PIN'
};
let room=null,me=null,doneSet=new Set(),busy=new Set(),adminPin='';

const $=id=>document.getElementById(id);
const normId=s=>String(s||'').replace(/^@+/,'').trim().toLowerCase();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,text,type=''){$ (id).innerHTML='<div class="msg '+type+'">'+esc(text)+'</div>'}
function isoLocal(v){if(!v)return null; const d=new Date(v); return isNaN(d)?null:d.toISOString()}

async function rpc(fn,p={}){
  const res=await fetch(SB_URL+'/rest/v1/rpc/'+encodeURIComponent(fn),{
    method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify(p)
  });
  const txt=await res.text(); let data=null;
  try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  if(!res.ok)throw new Error(typeof data==='string'?data:(data&&data.message)||JSON.stringify(data));
  return data;
}

function showSection(which){
  $('joinSection').classList.toggle('hidden',which!=='join');
  $('workSection').classList.toggle('hidden',which!=='work');
  $('tabJoin').classList.toggle('activeTab',which==='join');
  $('tabWork').classList.toggle('activeTab',which==='work');
}

async function boot(){
  try{
    const q=new URLSearchParams(location.search);
    const direct=String(q.get('room')||'').trim();
    if(direct){
      room={roomCode:direct};
    } else {
      const r=await rpc('get_current_entry_room_v1521',{});
      if(!r||!r.ok)throw new Error((r&&r.error)||'현재 공개된 굴비방이 없습니다.');
      room=r;
    }
    await loadRoom();
    preloadStorage();
    if(localStorage.getItem(STORE.nick)&&localStorage.getItem(STORE.iid))recoverMe(true);
  }catch(e){
    $('roomBox').className='msg err'; $('roomBox').textContent=e.message;
  }
}

async function loadRoom(){
  if(!room||!room.roomCode)return;
  const r=await rpc('get_room_snapshot_v1523',{p_room_code:room.roomCode});
  room=r; localStorage.setItem(STORE.room,r.roomCode);
  $('roomBox').className='msg ok';
  $('roomBox').innerHTML='<span class="topRoom">'+esc(r.title)+'</span> · '+esc(r.roomCode)+(r.note?'<br>'+esc(r.note):'');
  $('roomPills').innerHTML='<span class="pill">'+esc(r.status)+'</span><span class="pill">'+r.count+'/'+r.maxPeople+'명</span>';
  renderList(); renderProgress();
}

function preloadStorage(){
  const n=localStorage.getItem(STORE.nick)||'', i=localStorage.getItem(STORE.iid)||'';
  $('restoreNick').value=n; $('restoreId').value=i;
  $('regNick').value=n; $('regId').value=i;
}

function renderRegType(){
  $('urlWrap').classList.toggle('hidden',$('regType').value==='PENALTY');
}

async function registerMe(){
  if(!room)return;
  const nickname=$('regNick').value.trim(), iid=normId($('regId').value);
  const type=$('regType').value, url=$('regUrl').value.trim();
  $('regBtn').disabled=true;
  try{
    const r=await rpc('register_participant_v1523',{
      p_room_code:room.roomCode,p_nickname:nickname,p_instagram_id:iid,
      p_participation_type:type,p_url:type==='PENALTY'?null:url
    });
    localStorage.setItem(STORE.nick,r.nickname); localStorage.setItem(STORE.iid,r.instagramId);
    localStorage.setItem(STORE.token,r.clientToken);
    msg('regMsg',r.orderNo+'번으로 등록됐어요.','ok');
    $('restoreNick').value=r.nickname; $('restoreId').value=r.instagramId;
    await recoverMe(true); await loadRoom();
  }catch(e){msg('regMsg',e.message,'err')} finally{$('regBtn').disabled=false}
}

async function recoverMe(silent=false){
  if(!room)return;
  const nickname=$('restoreNick').value.trim()||localStorage.getItem(STORE.nick)||'';
  const iid=normId($('restoreId').value||localStorage.getItem(STORE.iid)||'');
  if(!nickname&&!iid){if(!silent)msg('restoreMsg','닉네임 또는 인스타 아이디를 입력해주세요.','err');return}
  try{
    const r=await rpc('get_my_participant_v1523',{
      p_room_code:room.roomCode,p_instagram_id:iid,p_nickname:nickname
    });
    if(!r||!r.found)throw new Error('등록된 참여정보를 찾지 못했어요.');
    me=r;
    localStorage.setItem(STORE.nick,r.nickname); localStorage.setItem(STORE.iid,r.instagramId);
    localStorage.setItem(STORE.token,r.clientToken);
    $('restoreNick').value=r.nickname; $('restoreId').value=r.instagramId;
    $('regNick').value=r.nickname; $('regId').value=r.instagramId;
    $('myCard').classList.remove('hidden'); $('registerCard').classList.add('hidden');
    $('myInfo').innerHTML='<b>'+esc(r.nickname)+'</b> · @'+esc(r.instagramId)+' · '+esc(r.participationType)+' · '+r.orderNo+'번';
    $('myLinkWrap').classList.toggle('hidden',r.participationType==='PENALTY');
    $('myLinkInput').value=r.url||'';
    if(!silent)msg('restoreMsg','내 참여정보를 불러왔어요.','ok');
    await loadMyDone();
    renderList(); renderProgress();
  }catch(e){if(!silent)msg('restoreMsg',e.message,'err')}
}

async function updateMyLink(){
  if(!me)return;
  try{
    const r=await rpc('update_my_link_v1523',{
      p_room_code:room.roomCode,p_instagram_id:me.instagramId,
      p_client_token:me.clientToken,p_url:$('myLinkInput').value.trim()
    });
    me.url=r.url; msg('myLinkMsg','내 링크를 수정했어요.','ok'); await loadRoom();
  }catch(e){msg('myLinkMsg',e.message,'err')}
}

async function loadMyDone(){
  if(!me)return;
  try{
    const r=await rpc('get_my_completions_v152',{
      p_room_code:room.roomCode,p_instagram_id:me.instagramId,p_client_token:me.clientToken
    });
    if(!r||!r.ok)throw new Error('완료기록을 불러오지 못했어요.');
    doneSet=new Set((r.items||[]).map(String)); renderList(); renderProgress();
  }catch(e){alert(e.message)}
}

function targets(){
  if(!room||!Array.isArray(room.links))return [];
  return room.links.filter(x=>x.entryType!=='PENALTY'&&x.url&&(!me||normId(x.instagramId)!==normId(me.instagramId)));
}
function renderProgress(){
  if(!me){$('progressText').textContent='내 참여정보를 먼저 불러와주세요.';$('progressBar').style.width='0%';return}
  if(me.participationType==='PASS'){$('progressText').textContent='프패 · 완료체크 면제';$('progressBar').style.width='100%';return}
  const arr=targets(), done=arr.filter(x=>doneSet.has(String(x.legacyLinkId||''))).length;
  $('progressText').textContent=done+' / '+arr.length+' 완료';
  $('progressBar').style.width=(arr.length?Math.round(done/arr.length*100):0)+'%';
}

function nextUnfinishedAfter(legacy){
  const arr=targets();
  const idx=arr.findIndex(x=>String(x.legacyLinkId)===String(legacy));
  for(let d=1;d<=arr.length;d++){
    const x=arr[(Math.max(idx,0)+d)%arr.length];
    if(!doneSet.has(String(x.legacyLinkId||'')))return x;
  }
  return null;
}

async function saveDone(legacy,isDone,nextUrl=''){
  if(!me){alert('내 참여정보를 먼저 불러와주세요.');return false}
  if(busy.has(legacy))return false;
  busy.add(legacy); renderList();
  try{
    const r=await rpc('set_completion_v152',{
      p_room_code:room.roomCode,p_instagram_id:me.instagramId,p_client_token:me.clientToken,
      p_target_legacy_link_id:legacy,p_is_done:!!isDone,
      p_client_action_at:Date.now(),p_client_action_id:'V1523_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)
    });
    doneSet=new Set((r.items||[]).map(String)); renderList(); renderProgress();
    if(isDone&&nextUrl)location.href=nextUrl;
    return true;
  }catch(e){alert('완료 저장 실패: '+e.message);return false}
  finally{busy.delete(legacy);renderList()}
}

function renderList(){
  const box=$('list'); if(!room||!Array.isArray(room.links)){box.innerHTML='';return}
  box.innerHTML='';
  room.links.forEach((x,idx)=>{
    const legacy=String(x.legacyLinkId||''), mine=me&&normId(x.instagramId)===normId(me.instagramId);
    const done=legacy&&doneSet.has(legacy), pend=busy.has(legacy);
    const row=document.createElement('div'); row.className='item';
    let buttons='';
    if(x.url)buttons+='<a class="btn" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">열기</a>';
    if(me && me.participationType!=='PASS' && !mine && x.entryType!=='PENALTY' && legacy){
      if(done)buttons+='<button class="done" '+(pend?'disabled':'')+' onclick="saveDone('+JSON.stringify(legacy)+',false)">✔ 완료 · 취소</button>';
      else {
        const next=nextUnfinishedAfter(legacy);
        if(next&&next.url)buttons+='<button class="ok" '+(pend?'disabled':'')+' onclick="saveDone('+JSON.stringify(legacy)+',true,'+JSON.stringify(next.url)+')">✔ 체크 · 다음 링크 열기</button>';
        else buttons+='<button class="ok" '+(pend?'disabled':'')+' onclick="saveDone('+JSON.stringify(legacy)+',true)">✔ 체크</button>';
      }
    }
    row.innerHTML='<div class="no">'+esc(x.no||idx+1)+'</div><div><div class="nick">'+esc(x.nickname)+(mine?' <span class="pill">내 링크</span>':'')+'</div><div class="iid">@'+esc(x.instagramId)+' · '+esc(x.participationType)+'</div><div class="actions">'+buttons+'</div></div>';
    box.appendChild(row);
  });
}

function openAdmin(){$('adminOverlay').classList.remove('hidden');$('adminPin').value=localStorage.getItem(STORE.pin)||''}
function closeAdmin(){$('adminOverlay').classList.add('hidden')}
async function adminLogin(){
  try{
    adminPin=$('adminPin').value.trim();
    const r=await rpc('verify_mone_admin_pin_v1523',{p_pin:adminPin});
    if(!r||!r.ok)throw new Error('운영진 PIN이 맞지 않습니다.');
    localStorage.setItem(STORE.pin,adminPin); $('adminPanel').classList.remove('hidden'); msg('adminMsg','운영진 모드로 들어왔어요.','ok'); await adminSummary();
  }catch(e){msg('adminMsg',e.message,'err')}
}
async function adminSummary(){
  if(!adminPin||!room)return;
  try{
    const r=await rpc('admin_room_summary_pin_v1523',{p_pin:adminPin,p_room_code:room.roomCode});
    $('adminSummary').textContent='현재방 '+room.roomCode+' · 전체 '+r.participants+'명 · 참여 '+r.general+' · 프패 '+r.pass+' · 벌칙 '+r.penalty+' · 링크 '+r.links;
  }catch(e){$('adminSummary').textContent=e.message}
}
async function adminCreateRoom(){
  try{
    const r=await rpc('admin_create_room_pin_v1523',{
      p_pin:adminPin,p_title:$('newTitle').value.trim(),p_max_people:Number($('newMax').value||300),
      p_note:$('newNote').value,p_participation_deadline:isoLocal($('newPartDeadline').value),
      p_completion_deadline:isoLocal($('newDoneDeadline').value),p_make_current:true
    });
    msg('createMsg','새 굴비방 '+r.roomCode+' 생성 완료 · 고정주소가 새 방으로 전환됐어요.','ok');
    room={roomCode:r.roomCode}; await loadRoom(); await adminSummary(); me=null;doneSet=new Set();
    $('myCard').classList.add('hidden');$('registerCard').classList.remove('hidden');showSection('join');
  }catch(e){msg('createMsg',e.message,'err')}
}
async function adminCloseCurrent(){
  if(!confirm('현재 굴비방을 마감할까요?'))return;
  try{await rpc('admin_close_room_pin_v1523',{p_pin:adminPin,p_room_code:room.roomCode});await loadRoom();msg('adminMsg','현재방을 마감했어요.','ok')}catch(e){msg('adminMsg',e.message,'err')}
}

boot();
</script>
</body>
</html>
